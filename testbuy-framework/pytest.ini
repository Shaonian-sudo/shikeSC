# TestBuy-Framework 测试框架配置
# 运行：pytest tests/ -v
[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: 冒烟测试，覆盖核心交易流程
    regression: 回归测试，覆盖各业务模块

addopts =
    -v
    --strict-markers
    --html=reports/report.html
    --self-contained-html
