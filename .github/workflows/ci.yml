# 试客商城 TestBuy Mall · 持续集成（CI）
# 触发：push / PR 到 main 分支
# 流程：安装依赖 → 初始化数据并启动被测系统 → 运行接口自动化测试 → 上传测试报告
# 说明：接口层自动化（pytest + requests，秒级、无浏览器依赖）由 CI 全自动保障；
#       UI 回归（Selenium 无头）本地全量运行：python -m pytest tests/ -v
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r testbuy-mall/requirements.txt
          pip install -r testbuy-framework/requirements.txt

      - name: Seed database and start app
        run: |
          cd testbuy-mall
          python seed.py
          nohup python app.py > /tmp/testbuy-app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/ > /dev/null; then
              echo "TestBuy Mall is ready"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start, last log lines:"
          tail -50 /tmp/testbuy-app.log
          exit 1

      - name: Run API tests
        working-directory: testbuy-framework
        run: |
          python -m pytest tests/test_api_flow.py -v --html=reports/report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: testbuy-framework/reports/report.html
