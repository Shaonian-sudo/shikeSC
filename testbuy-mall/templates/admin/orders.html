{% extends "base.html" %}
{% block content %}
<h2 class="page-title">后台 · 订单管理</h2>
<table class="table" data-testid="admin-orders-table">
  <thead><tr><th>ID</th><th>订单号</th><th>用户</th><th>金额</th><th>状态</th><th>下单时间</th></tr></thead>
  <tbody>
    {% for o in orders %}
    <tr data-testid="admin-order-row">
      <td>{{ o['id'] }}</td>
      <td>{{ o['order_no'] }}</td>
      <td>{{ o['receiver'] }}</td>
      <td>¥{{ '%.2f'|format(o['total_amount']) }}</td>
      <td><span class="status" data-testid="order-status">{{ o['status'] }}</span></td>
      <td>{{ o['created_at'] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
