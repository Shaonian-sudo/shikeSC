{% extends "base.html" %}
{% block content %}
<div class="success-card" data-testid="order-success">
  <div class="success-icon">✓</div>
  <h2>下单成功</h2>
  <p>订单号：<span data-testid="order-no">{{ order['order_no'] }}</span></p>
  <p>应付金额：<span class="p-price" data-testid="order-amount">¥{{ '%.2f'|format(order['total_amount']) }}</span></p>
  <p>收货信息：{{ order['receiver'] }} {{ order['phone'] }} {{ order['address'] }}</p>
  <div class="actions">
    <a class="btn-primary" href="{{ url_for('order_detail', order_id=order['id']) }}" data-testid="view-order">查看订单</a>
    <a class="btn-plain" href="{{ url_for('index') }}" data-testid="continue-shopping">继续购物</a>
  </div>
</div>
{% endblock %}
