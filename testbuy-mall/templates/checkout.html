{% extends "base.html" %}
{% block content %}
<h2 class="page-title">确认订单</h2>
<div class="checkout-wrap">
  <div>
    <table class="table" data-testid="checkout-table">
      <thead><tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th></tr></thead>
      <tbody>
        {% for it in items %}
        <tr data-testid="checkout-item">
          <td>{{ it['name'] }}</td>
          <td>¥{{ '%.2f'|format(it['price']) }}</td>
          <td>{{ it['quantity'] }}</td>
          <td>¥{{ '%.2f'|format(it['price'] * it['quantity']) }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <form method="post" class="address-form" data-testid="checkout-form">
    <label>收货人
      <input type="text" name="receiver" value="{{ current_user['username'] }}" data-testid="checkout-receiver">
    </label>
    <label>手机号
      <input type="text" name="phone" placeholder="11 位手机号" data-testid="checkout-phone">
    </label>
    <label>收货地址
      <input type="text" name="address" placeholder="省市区 + 详细地址" data-testid="checkout-address">
    </label>
    <div class="checkout-summary">
      <span class="total" data-testid="checkout-total">应付：¥{{ '%.2f'|format(total) }}</span>
      <button type="submit" class="btn-primary" data-testid="submit-order">提交订单</button>
    </div>
  </form>
</div>
{% endblock %}
